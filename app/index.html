<!doctype html>
<html lang="ko" class="dark booting" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RobinX</title>
    <!-- 브라우저가 favicon.ico를 찾다 404를 내지 않게 (창 아이콘은 exe 아이콘을 쓴다) -->
    <link rel="icon" href="data:," />
    <script>
      // 저장된 테마를 바로 적용하고, 창을 곧바로 보여 준다 (앱 코드를 읽는 동안 아래 시작 화면이 보인다).
      try {
        const saved = localStorage.getItem("robin.theme")
        if (saved === "light" || (saved === "system" && matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.classList.replace("dark", "light")
          document.documentElement.dataset.theme = "light"
          document.documentElement.style.colorScheme = "light"
        }
      } catch {}
      // 창 열림: 창이 실제로 보인 다음에 시작 화면 판을 키운다. 먼저 시작하면 창이 뜰 때 이미 다 커져 있다.
      // 다 커지면 .booting을 떼고 바탕을 칠한다 (main.tsx는 이 신호를 기다렸다가 시작 화면을 넘긴다).
      ;(() => {
        const html = document.documentElement
        let started = false
        const opened = () => {
          if (window.__bootOpened) return
          window.__bootOpened = true
          html.classList.remove("booting", "opening")
          window.dispatchEvent(new Event("robin:boot-opened"))
        }
        const start = () => {
          if (started) return
          started = true
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              html.classList.add("opening")
              setTimeout(opened, 800) // animationend가 오지 않을 때를 위한 안전장치
            }),
          )
        }
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) opened()
        addEventListener("animationend", (e) => e.animationName === "boot-open" && opened())
        let shown = null
        try {
          shown = window.__TAURI_INTERNALS__?.invoke("plugin:window|show", { label: "main" })
        } catch {}
        if (shown) shown.then(start, start)
        else addEventListener("DOMContentLoaded", start)
        setTimeout(start, 2500)
        setTimeout(opened, 4000)
      })()
    </script>
    <style>html.booting,html.booting body{background:0 0!important}html.booting #root{visibility:hidden}html.booting #boot{opacity:0;will-change:transform, opacity;border-radius:12px}html.booting.opening #boot{animation:.52s cubic-bezier(.22,1,.36,1) both boot-open}@keyframes boot-open{0%{opacity:0;transform:scale(.9)}60%{opacity:1}to{opacity:1;transform:scale(1)}}.tty{z-index:200;color:#e6e7e9;font-variant-numeric:tabular-nums;background:#0e1012;font:450 13px/1.5 Pretendard Variable,Pretendard,Segoe UI,Malgun Gothic,sans-serif;position:fixed;inset:0;overflow:hidden}.tty-body{z-index:1;flex-direction:column;justify-content:flex-end;width:min(30rem,100% - 4rem);max-height:calc(100vh - 3.5rem);margin:0 auto;padding-top:clamp(1.5rem,12vh,7rem);display:flex;position:relative;overflow:hidden}.tty-body>*{flex-shrink:0}.tty-brand{align-items:center;gap:12px;margin-bottom:22px;display:flex}.tty-mark{color:#fff;letter-spacing:-.02em;text-shadow:0 0 10px #4b7dfee6;background:#060a14;border-radius:9px;flex:none;place-items:center;width:40px;height:40px;font-size:20px;font-weight:900;display:grid}.tty-brand b{color:#f0f0f0;font-size:19px;font-weight:650;line-height:22px;display:block}.tty-brand small{color:#7d8187;margin-top:2px;font-size:12px;display:block}.tty-label{letter-spacing:.02em;color:#7d8187;margin:0 0 6px;padding:0 6px;font-size:11px;font-weight:500}.tty-card{background:#0f1115;border-radius:12px;margin-bottom:14px;padding:2px 0;box-shadow:inset 0 0 0 1px #181a1d,inset 0 1px #212428}.tty-row{white-space:nowrap;align-items:center;gap:10px;min-height:33px;margin:0 9px;padding:0 6px;display:flex}.tty-row+.tty-row{box-shadow:0 -1px #181a1d}.tty-row>.tty-text{text-overflow:ellipsis;flex:1;min-width:0;overflow:hidden}.tty-key{color:#8a8e94;flex:none;width:5.5rem}.tty-dim{color:#8a8e94}.tty-strong{color:#f0f0f0;font-weight:550}.tty-chip{--tick:#98a4b8;color:#f0f0f0;background:#08090b;border-radius:9999px;flex:none;align-items:center;gap:5px;height:20px;padding:0 8px 0 13px;font-size:11px;font-weight:550;display:inline-flex;position:relative;box-shadow:inset 0 0 0 1px #25282d,inset 0 1px #ffffff0d}.tty-chip:before{content:"";background:var(--tick);border-radius:1px;width:2px;height:44%;position:absolute;top:28%;left:6px}.tty-chip[data-tone=on]{--tick:#4b7dfe}.tty-chip[data-tone=note]{--tick:#c27463;color:#c27463}.tty-chip[data-tone=alarm]{--tick:#d52236;color:#e5475a}.tty-spin{border:1.5px solid #4b7dfe4d;border-top-color:#4b7dfe;border-radius:50%;width:9px;height:9px;animation:.8s linear infinite tty-spin}@keyframes tty-spin{to{transform:rotate(360deg)}}.tty-bar{background:#1c1e24;border-radius:2px;flex:1;height:3px;overflow:hidden}.tty-bar>i{transform-origin:0;background:#4b7dfe;height:100%;transition:transform .2s cubic-bezier(.23,1,.32,1);display:block}.tty-progress{color:#7d8187;align-items:center;gap:10px;margin:-4px 6px 0;font-size:11px;display:flex}.tty-btn{color:#e6e7e9;min-height:26px;font:inherit;cursor:pointer;background:#14151c;border:0;border-radius:6px;flex:none;padding:0 10px;font-size:12px;font-weight:550;transition:background-color .15s ease-out,transform .2s cubic-bezier(.23,1,.32,1);box-shadow:inset 0 0 0 1px #26272d}.tty-btn:hover{background:#1b1d25}.tty-btn:active{transition-duration:.15s,.16s;transform:scale(.97)}.tty-btn--primary{box-shadow:none;color:#fff;background:#3d6af0}.tty-btn--primary:hover{background:#4b7dfe}.tty-btn:focus-visible{outline-offset:2px;outline:2px solid #4b7dfe}.tty-btn kbd{font:inherit;opacity:.6;margin-left:5px}#boot .tty-brand{animation:.24s cubic-bezier(.23,1,.32,1) 80ms both tty-in}.tty-in{animation:.2s cubic-bezier(.23,1,.32,1) both tty-in}@keyframes tty-in{0%{opacity:0;transform:translateY(4px)}}@media (prefers-reduced-motion:reduce){html.booting #boot{opacity:1;animation:none}#boot .tty-brand,.tty-in{animation:none}.tty-spin{animation-duration:2.4s}}</style>
    <script type="module" crossorigin src="./assets/index-CBYjmgYi.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BL32oyRx.css">
  </head>

  <body>
    <!-- 앱 코드가 뜨기 전 첫 화면. React의 StartupSplash(components/startup-splash.tsx)가 같은 모양으로 이어받는다. -->
    <div id="boot" class="tty" data-tauri-drag-region role="status" aria-label="RobinX를 여는 중이에요">
      <div class="tty-body" data-tauri-drag-region>
        <div class="tty-brand" aria-hidden="true">
          <span class="tty-mark">R</span>
          <span><b>RobinX</b><small>v0.1.18 · Windows x64</small></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
