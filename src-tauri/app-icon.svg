<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 브랜드 V5의 브랜드 칸 표: 짙은 표(#060a14) 위의 흰 R(Pretendard Black)과 파란 번짐.
       앱 아이콘(src-tauri/icons/)은 이 그림이 아니라 scripts/make-icon.mjs가 글꼴을 실어 그린 app-icon.png에서 만든다. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feFlood flood-color="#4b7dfe" flood-opacity="0.9"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14.5" fill="#060a14"/>
  <rect x="0.2" y="0.2" width="63.6" height="63.6" rx="14.3" fill="none" stroke="#1a1f2b" stroke-width="0.4"/>
  <text x="32" y="44.5" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="37" font-weight="900" fill="#fff" filter="url(#glow)">R</text>
</svg>
