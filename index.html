<!doctype html>
<html lang="ko" class="dark booting" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RobinX</title>
    <!-- 브라우저가 favicon.ico를 찾다 404를 내지 않게 (창 아이콘은 exe 아이콘을 쓴다) -->
    <link rel="icon" href="data:," />
    <script>
      // 저장된 테마를 바로 적용하고, 창을 곧바로 보여 준다 (앱 코드를 읽는 동안 아래 시작 화면이 보인다).
      try {
        const saved = localStorage.getItem("robin.theme")
        if (saved === "light" || (saved === "system" && matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.classList.replace("dark", "light")
          document.documentElement.dataset.theme = "light"
          document.documentElement.style.colorScheme = "light"
        }
      } catch {}
      // 창 열림: 창이 실제로 보인 다음에 시작 화면 판을 키운다. 먼저 시작하면 창이 뜰 때 이미 다 커져 있다.
      // 다 커지면 .booting을 떼고 바탕을 칠한다 (main.tsx는 이 신호를 기다렸다가 시작 화면을 넘긴다).
      ;(() => {
        const html = document.documentElement
        let started = false
        const opened = () => {
          if (window.__bootOpened) return
          window.__bootOpened = true
          html.classList.remove("booting", "opening")
          window.dispatchEvent(new Event("robin:boot-opened"))
        }
        const start = () => {
          if (started) return
          started = true
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              html.classList.add("opening")
              setTimeout(opened, 800) // animationend가 오지 않을 때를 위한 안전장치
            }),
          )
        }
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) opened()
        addEventListener("animationend", (e) => e.animationName === "boot-open" && opened())
        let shown = null
        try {
          shown = window.__TAURI_INTERNALS__?.invoke("plugin:window|show", { label: "main" })
        } catch {}
        if (shown) shown.then(start, start)
        else addEventListener("DOMContentLoaded", start)
        setTimeout(start, 2500)
        setTimeout(opened, 4000)
      })()
    </script>
    <style>
      /* 창 열림: 창은 투명하게 만들어져 있어서, 시작 화면을 작은 둥근 판으로 그렸다가 창 크기로 키우면
         창이 작게 떴다가 커지는 것처럼 보인다. 다 커지면 .booting을 떼고 바탕을 불투명하게 칠한다. */
      html.booting, html.booting body { background: transparent !important; }
      html.booting #root { visibility: hidden; }
      /* 모서리는 움직이지 않는다: border-radius를 움직이면 매 프레임 다시 그려야 해서, 앱 코드를 읽느라 바쁠 때 멈칫한다.
         transform·opacity만 움직이면 GPU가 따로 그려 매끄럽다. */
      html.booting #boot { opacity: 0; border-radius: 12px; will-change: transform, opacity; }
      html.booting.opening #boot { animation: boot-open 0.52s cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes boot-open {
        from { opacity: 0; transform: scale(0.9); }
        60% { opacity: 1; }
        to { opacity: 1; transform: scale(1); }
      }
      /* 시작 화면 (브랜드 V5). 앱 코드가 뜨기 전(#boot)과 React의 StartupSplash가 같은 클래스(.tty-*)를 써서
         자리·모양이 같다. 그래서 넘겨줄 때 바뀌는 게 보이지 않는다. 테마와 관계없이 늘 어둡다.
         값은 src/brand-kit/robin-ui.css의 어두운 값 그대로다 (이 글은 앱 CSS보다 먼저 읽혀서 변수를 못 쓴다). */
      .tty {
        position: fixed; inset: 0; z-index: 200; overflow: hidden;
        background: #0e1012; color: #e6e7e9;
        font: 450 13px/1.5 "Pretendard Variable", Pretendard, "Segoe UI", "Malgun Gothic", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      /* 줄이 창보다 길어지면 위쪽이 밀려 올라간다. 넘치지 않을 때는 위에서부터 그대로 쌓인다. */
      .tty-body {
        position: relative; z-index: 1; width: min(30rem, calc(100% - 4rem)); margin: 0 auto; padding-top: clamp(1.5rem, 12vh, 7rem);
        display: flex; flex-direction: column; justify-content: flex-end; max-height: calc(100vh - 3.5rem); overflow: hidden;
      }
      .tty-body > * { flex-shrink: 0; }
      /* 브랜드 칸: 짙은 표 위의 흰 R과 파란 번짐, 이름, 아랫줄 */
      .tty-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
      .tty-mark {
        display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 9px;
        background: #060a14; color: #fff; font-size: 20px; font-weight: 900; letter-spacing: -0.02em;
        text-shadow: 0 0 10px rgb(75 125 254 / 90%);
      }
      .tty-brand b { display: block; font-size: 19px; font-weight: 650; line-height: 22px; color: #f0f0f0; }
      .tty-brand small { display: block; margin-top: 2px; font-size: 12px; color: #7d8187; }
      /* 카드: 이름표는 밖 위, 줄 사이 선은 안쪽에서 9 들여서 */
      .tty-label { margin: 0 0 6px; padding: 0 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: #7d8187; }
      .tty-card { margin-bottom: 14px; padding: 2px 0; border-radius: 12px; background: #0f1115; box-shadow: inset 0 0 0 1px #181a1d, inset 0 1px 0 #212428; }
      .tty-row { display: flex; align-items: center; gap: 10px; min-height: 33px; margin: 0 9px; padding: 0 6px; white-space: nowrap; }
      .tty-row + .tty-row { box-shadow: 0 -1px 0 #181a1d; }
      .tty-row > .tty-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .tty-key { flex: none; width: 5.5rem; color: #8a8e94; }
      .tty-dim { color: #8a8e94; }
      .tty-strong { color: #f0f0f0; font-weight: 550; }
      /* 상태 칩(표시기): 짙은 알약 + 왼쪽의 짧은 색 막대. 막대 색이 뜻이다 */
      .tty-chip {
        --tick: #98a4b8; position: relative; flex: none; display: inline-flex; align-items: center; gap: 5px;
        height: 20px; padding: 0 8px 0 13px; border-radius: 9999px; background: #08090b;
        box-shadow: inset 0 0 0 1px #25282d, inset 0 1px 0 rgb(255 255 255 / 5%); font-size: 11px; font-weight: 550; color: #f0f0f0;
      }
      .tty-chip::before { content: ""; position: absolute; left: 6px; top: 28%; width: 2px; height: 44%; border-radius: 1px; background: var(--tick); }
      .tty-chip[data-tone="on"] { --tick: #4b7dfe; }
      .tty-chip[data-tone="note"] { --tick: #c27463; color: #c27463; }
      .tty-chip[data-tone="alarm"] { --tick: #d52236; color: #e5475a; }
      .tty-spin { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid rgb(75 125 254 / 30%); border-top-color: #4b7dfe; animation: tty-spin 0.8s linear infinite; }
      @keyframes tty-spin { to { transform: rotate(360deg); } }
      /* 막대: 두께 3, 빈 곳 #1c1e24, 채움 파랑 */
      .tty-bar { flex: 1; height: 3px; border-radius: 2px; background: #1c1e24; overflow: hidden; }
      .tty-bar > i { display: block; height: 100%; background: #4b7dfe; transform-origin: left; transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1); }
      .tty-progress { display: flex; align-items: center; gap: 10px; margin: -4px 6px 0; color: #7d8187; font-size: 11px; }
      /* 업데이트 묻기의 두 단추 (y·n 키로도 고른다) */
      .tty-btn {
        flex: none; min-height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: #14151c; box-shadow: inset 0 0 0 1px #26272d;
        color: #e6e7e9; font: inherit; font-size: 12px; font-weight: 550; cursor: pointer;
        transition: background-color 150ms ease-out, transform 200ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .tty-btn:hover { background: #1b1d25; }
      .tty-btn:active { transform: scale(0.97); transition-duration: 150ms, 160ms; }
      .tty-btn--primary { background: #3d6af0; box-shadow: none; color: #fff; }
      .tty-btn--primary:hover { background: #4b7dfe; }
      .tty-btn:focus-visible { outline: 2px solid #4b7dfe; outline-offset: 2px; }
      .tty-btn kbd { margin-left: 5px; font: inherit; opacity: 0.6; }
      /* 창이 열리는 동안 브랜드 칸이 4px 올라오며 켜진다 (창 열림 0.52초 안에 끝난다) */
      #boot .tty-brand { animation: tty-in 0.24s cubic-bezier(0.23, 1, 0.32, 1) 0.08s both; }
      .tty-in { animation: tty-in 0.2s cubic-bezier(0.23, 1, 0.32, 1) both; }
      @keyframes tty-in { from { opacity: 0; transform: translateY(4px); } }
      @media (prefers-reduced-motion: reduce) {
        html.booting #boot { animation: none; opacity: 1; }
        #boot .tty-brand, .tty-in { animation: none; }
        .tty-spin { animation-duration: 2.4s; }
      }
    </style>
  </head>

  <body>
    <!-- 앱 코드가 뜨기 전 첫 화면. React의 StartupSplash(components/startup-splash.tsx)가 같은 모양으로 이어받는다. -->
    <div id="boot" class="tty" data-tauri-drag-region role="status" aria-label="RobinX를 여는 중이에요">
      <div class="tty-body" data-tauri-drag-region>
        <div class="tty-brand" aria-hidden="true">
          <span class="tty-mark">R</span>
          <span><b>RobinX</b><small>v%VITE_APP_VERSION% · Windows x64</small></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
