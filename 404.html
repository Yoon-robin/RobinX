<!doctype html>
<!-- GitHub Pages가 없는 주소에 보여 주는 쪽. 기본 쪽은 영어에 밝은 화면이라 사이트(브랜드 V5)와 맞춘다. 배포 주소(/RobinX/) 기준. -->
<html lang="ko" style="background: #0e1012">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1012" />
    <meta name="robots" content="noindex" />
    <title>찾는 쪽이 없어요 · RobinX</title>
    <link rel="icon" type="image/png" href="/RobinX/logo.png?v=3" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0e1012;
        color: #e6e7e9;
        font-family:
          "Pretendard Variable",
          Pretendard,
          -apple-system,
          "Segoe UI",
          "Malgun Gothic",
          sans-serif;
        text-align: center;
      }
      img {
        width: 48px;
        height: 48px;
      }
      h1 {
        margin: 24px 0 12px;
        color: #f0f0f0;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 32px;
        color: #8a8e94;
        font-size: 16px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 20px;
        border-radius: 7px;
        background: #3d6af0;
        color: #fff;
        font-weight: 550;
        text-decoration: none;
        transition: background-color 150ms ease-out;
      }
      a:hover {
        background: #4b7dfe;
      }
      a:focus-visible {
        outline: 2px solid #4b7dfe;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/RobinX/logo.png?v=3" alt="" />
      <h1>찾는 쪽이 없어요</h1>
      <p>주소가 바뀌었거나 잘못 입력된 것 같아요.</p>
      <a href="/RobinX/">RobinX 첫 화면으로</a>
    </main>
  </body>
</html>
