<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 740 270" width="740" height="270">
  <!-- RobinX 워드마크: 시작 화면 로고와 같은 5줄 × 28칸. 흰색에서 회색으로(위→아래), 흰 글로우 -->
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="90">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-120%" width="160%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="near"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.30"/><feComposite in2="near" operator="in" result="nearGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="26" result="far"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.12"/><feComposite in2="far" operator="in" result="farGlow"/>
      <feMerge><feMergeNode in="farGlow"/><feMergeNode in="nearGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="url(#ink)" shape-rendering="crispEdges" filter="url(#glow)"><rect x="1" y="1" width="18" height="16"/><rect x="21" y="1" width="18" height="16"/><rect x="41" y="1" width="18" height="16"/><rect x="61" y="1" width="18" height="16"/><rect x="221" y="1" width="18" height="16"/><rect x="321" y="1" width="18" height="16"/><rect x="461" y="1" width="18" height="16"/><rect x="541" y="1" width="18" height="16"/><rect x="1" y="19" width="18" height="16"/><rect x="81" y="19" width="18" height="16"/><rect x="141" y="19" width="18" height="16"/><rect x="161" y="19" width="18" height="16"/><rect x="221" y="19" width="18" height="16"/><rect x="241" y="19" width="18" height="16"/><rect x="261" y="19" width="18" height="16"/><rect x="361" y="19" width="18" height="16"/><rect x="381" y="19" width="18" height="16"/><rect x="401" y="19" width="18" height="16"/><rect x="481" y="19" width="18" height="16"/><rect x="521" y="19" width="18" height="16"/><rect x="1" y="37" width="18" height="16"/><rect x="21" y="37" width="18" height="16"/><rect x="41" y="37" width="18" height="16"/><rect x="61" y="37" width="18" height="16"/><rect x="121" y="37" width="18" height="16"/><rect x="181" y="37" width="18" height="16"/><rect x="221" y="37" width="18" height="16"/><rect x="281" y="37" width="18" height="16"/><rect x="321" y="37" width="18" height="16"/><rect x="361" y="37" width="18" height="16"/><rect x="421" y="37" width="18" height="16"/><rect x="501" y="37" width="18" height="16"/><rect x="1" y="55" width="18" height="16"/><rect x="61" y="55" width="18" height="16"/><rect x="121" y="55" width="18" height="16"/><rect x="181" y="55" width="18" height="16"/><rect x="221" y="55" width="18" height="16"/><rect x="281" y="55" width="18" height="16"/><rect x="321" y="55" width="18" height="16"/><rect x="361" y="55" width="18" height="16"/><rect x="421" y="55" width="18" height="16"/><rect x="481" y="55" width="18" height="16"/><rect x="521" y="55" width="18" height="16"/><rect x="1" y="73" width="18" height="16"/><rect x="81" y="73" width="18" height="16"/><rect x="141" y="73" width="18" height="16"/><rect x="161" y="73" width="18" height="16"/><rect x="221" y="73" width="18" height="16"/><rect x="241" y="73" width="18" height="16"/><rect x="261" y="73" width="18" height="16"/><rect x="321" y="73" width="18" height="16"/><rect x="361" y="73" width="18" height="16"/><rect x="421" y="73" width="18" height="16"/><rect x="461" y="73" width="18" height="16"/><rect x="541" y="73" width="18" height="16"/></g>
</svg>
